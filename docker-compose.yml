services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-api-kit-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Lima}
      TZ: ${APP_TIMEZONE:-America/Lima}
    command: ["php-fpm"]
